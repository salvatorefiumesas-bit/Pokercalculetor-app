name: Build APK Android

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rinomina APK
        run: cp build/app/outputs/flutter-apk/app-release.apk poker-gto-trainer.apk

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: poker-gto-trainer-apk
          path: poker-gto-trainer.apk

      - name: Pubblica release (solo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: poker-gto-trainer.apk
