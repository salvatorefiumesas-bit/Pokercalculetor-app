name: Build APK Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Analisi statica
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: >
          flutter build apk --release
          --build-name=1.0.${{ github.run_number }}
          --build-number=${{ github.run_number }}

      - name: Rinomina APK
        run: cp build/app/outputs/flutter-apk/app-release.apk poker-gto-trainer.apk

      - name: Carica APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: poker-gto-trainer-apk
          path: poker-gto-trainer.apk

      # Ogni build di main diventa una release: l'app la trova e propone
      # l'aggiornamento.
      - name: Pubblica release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Versione 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: poker-gto-trainer.apk
